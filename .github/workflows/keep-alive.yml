name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after 15 minutes of no
    # traffic, so this keeps a safety margin. GitHub's scheduler isn't
    # exact under load, so treat this as "roughly every 10 minutes."
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Ping the actual custom domain, not the bare onrender.com one — the
      # latter returns 503 once a custom domain is attached (confirmed by
      # hand), so it was never reliably reaching or waking the live service.
      - name: Ping rts.fm
        run: |
          curl -sS --fail --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://rts.fm
