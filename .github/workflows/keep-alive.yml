name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after 15 minutes of no
    # traffic, so this keeps a safety margin. GitHub's scheduler isn't
    # exact under load, so treat this as "roughly every 10 minutes."
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping rts-fm-site.onrender.com
        run: |
          curl -sS --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://rts-fm-site.onrender.com
