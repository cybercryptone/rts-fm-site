services:
  - type: web
    name: rts-fm-site
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://rts.fm
# Render Cron Jobs don't support the free plan (they're always billed on
# paid compute, 0.5c-512mb minimum) — confirmed by a failed Blueprint sync:
# "services[1].plan: free not a valid plan for service type cron". The
# GitHub Actions workflow at .github/workflows/keep-alive.yml pings rts.fm
# every 10 minutes for free instead and covers the same need.
